name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dosyalari kontrol et
        run: |
          ls -la . www resources ios-patch || true
          test -f www/index.html || { echo "HATA: www/index.html yok"; exit 1; }
          SZ=$(wc -c < www/index.html); echo "index.html boyutu: $SZ"
          [ "$SZ" -gt 150000 ] || { echo "HATA: www/index.html reChat dosyasi degil (cok kucuk)"; exit 1; }
          test -f package.json || { echo "HATA: package.json yok"; exit 1; }
          test -f capacitor.config.json || { echo "HATA: capacitor.config.json yok"; exit 1; }
          test -f ios-patch/patch-ios.sh || { echo "HATA: ios-patch/patch-ios.sh yok"; exit 1; }
      - run: npm install
      - run: npx cap add ios
      - name: Ikon ve acilis ekrani
        run: |
          if [ -f resources/icon.png ]; then
            [ -f resources/icon-only.png ] || cp resources/icon.png resources/icon-only.png
            npx capacitor-assets generate --ios || echo "ikon atlandi"
          else
            echo "resources/icon.png yok, varsayilan ikon kullanilacak"
          fi
      - run: bash ios-patch/patch-ios.sh
      - run: npx cap sync ios
      - name: Archive
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: ipa olustur
        run: |
          mkdir -p Payload
          cp -R ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry reChat.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: reChat-ipa
          path: reChat.ipa
