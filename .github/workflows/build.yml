name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Klasorleri hazirla
        run: |
          mkdir -p www resources
          cp index.html www/index.html
          cp icon.png resources/icon.png
          cp icon.png resources/icon-only.png
          cp splash.png resources/splash.png
          chmod +x patch-ios.sh
      - run: npm install
      - run: npx cap add ios
      - run: npx capacitor-assets generate --ios
      - run: ./patch-ios.sh
      - run: npx cap sync ios
      - name: Archive
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: ipa olustur
        run: |
          mkdir -p Payload
          cp -R ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry reChat.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: reChat-ipa
          path: reChat.ipa

